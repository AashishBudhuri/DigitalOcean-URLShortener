# DigitalOcean Managed PostgreSQL (activate with SPRING_PROFILES_ACTIVE=prod)
# Values come from .env (see .env.example)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:25060}/${DB_NAME:defaultdb}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false
