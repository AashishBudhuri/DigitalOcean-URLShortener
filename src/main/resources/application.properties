server.port=${SERVER_PORT:8080}

# Serve the existing frontend from ./public
spring.web.resources.static-locations=file:./public/,classpath:/static/
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/**

spring.jpa.open-in-view=false
url.default-ttl-seconds=${URL_DEFAULT_TTL_SECONDS:86400}

# Local default: in-memory H2 (override with profile "prod" for Managed Postgres)
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
